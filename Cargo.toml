[workspace]
resolver = "2"
members = ["neuros-core", "neuros-cli", "neuros-gui"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["edbgon"]
repository = "https://github.com/edbgon/neuros-db"
keywords = ["neuros", "mp3", "ogg", "database", "audio-player"]

[profile.release]
lto = "thin"
strip = true
